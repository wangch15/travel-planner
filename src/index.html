<title>/*__TITLE__*/</title>

<symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.6" r="1.8"/><path d="M11 21l1.6-5.2-2.4-2.3.9-4.6 2.6.9 1.4 2.6 2.4.9M10.1 9.9 7.6 11l-1 3M12.6 15.8 9.8 21"/></symbol>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 id="brandTitle"></h1>
      <span class="sub" id="brandSub"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="theme">
        <svg class="ico icon-sun"><use href="#i-sun"/></svg>
        <svg class="ico icon-moon"><use href="#i-moon"/></svg>
        <span class="sr">切換深色或淺色外觀</span>
      </button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="行程日期"></nav>
  </div>
</header>

<div class="wrap">
  <div class="split">
    <div class="mapwrap">
      <figure class="map" id="map">
        <svg id="svg" role="img" aria-label="行程各點的相對位置地形圖"></svg>
        <div class="pins" id="pins"></div>
        <div class="mapbar">
          <button id="zin"><svg class="ico"><use href="#i-plus"/></svg><span class="sr">放大</span></button>
          <button id="zout"><svg class="ico"><use href="#i-minus"/></svg><span class="sr">縮小</span></button>
          <button id="zfit"><svg class="ico"><use href="#i-fit"/></svg><span class="sr">回到當日全景</span></button>
        </div>
      </figure>
      <div class="mapfoot">
        <span class="scalebar"><span class="scaleline" id="scaleline"></span><span class="num" id="scaletext">10 km</span></span>
        <span id="contourNote"></span>
        <span class="sp"></span>
        <span id="mapCredit"></span>
      </div>
    </div>
    <main id="panel"></main>
  </div>
</div>

<button type="button" class="fab" id="fab"><svg class="ico"><use href="#i-map"/></svg><span class="sr">打開地圖</span></button>

<dialog class="mapdlg" id="mapdlg" aria-labelledby="mapdlgTitle">
  <div class="mapdlg-in">
    <div class="mapdlg-head">
      <h2 id="mapdlgTitle"><span class="bar"></span><span id="mapdlgLabel">地圖</span></h2>
      <span class="hint">點標記會關閉地圖並跳到該行程；可雙指縮放</span>
      <button type="button" class="mapdlg-x" id="mapdlgClose"><svg class="ico"><use href="#i-x"/></svg><span class="sr">關閉地圖</span></button>
    </div>
    <div class="mapdlg-body" id="mapdlgBody"></div>
  </div>
</dialog>

<dialog class="lb" id="lb" aria-labelledby="lbTitle">
  <div class="lb-in">
    <button type="button" class="lb-x" id="lbClose"><svg class="ico"><use href="#i-x"/></svg><span class="sr">關閉</span></button>
    <div class="lb-slider">
      <div class="lb-track" id="lbTrack"></div>
      <button type="button" class="lb-nav prev" id="lbPrev"><svg class="ico"><use href="#i-chev"/></svg><span class="sr">上一張</span></button>
      <button type="button" class="lb-nav next" id="lbNext"><svg class="ico"><use href="#i-chev"/></svg><span class="sr">下一張</span></button>
      <div class="lb-dots" id="lbDots"></div>
    </div>
    <div class="lb-body" id="lbBody"></div>
  </div>
</dialog>

const CONFIG = /*__CONFIG__*/null;

const PHOTOS = /*__PHOTOS__*/null;

</script>
