<title>仙台山形自駕手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F4F0E5; --card:#FBF8F1; --sunk:#EAE3D2;
  --ink:#231F19; --ink-2:#585141; --ink-3:#6A6150;
  --dc-shift:#17110A;
  --rule:#DCD4C1; --rule-2:#C6BBA0;
  --sea:#D2DFE6; --sea-line:#7FA7B8; --land:#F1ECDE;
  --contour:#C9BB9C; --border-line:#B9A98B;
  --road-hi:#C09750; --road-mid:#D3BC8C; --road-lo:#DED2B4; --river:#A6C4D6;
  --accent:#B0552D; --accent-t:#8E4021; --focus:#B0552D;
  --shadow-1:0 1px 2px rgba(74,60,34,.08);
  --shadow-2:0 2px 4px rgba(74,60,34,.06), 0 12px 28px rgba(74,60,34,.08);
  --serif:"Noto Serif TC",'Songti TC','Times New Roman',serif;
  --sans:"Noto Sans TC",-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --maxw:1460px; --headh:92px;
}
@media (min-width:920px){:root{--headh:100px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15130F; --card:#1D1A15; --sunk:#100E0A;
  --ink:#EFE9DB; --ink-2:#ADA48F; --ink-3:#8C8471;
  --dc-shift:#FFF4E2;
  --rule:#312C23; --rule-2:#443D30;
  --sea:#15242C; --sea-line:#39606F; --land:#1B1813;
  --contour:#3A3323; --border-line:#5A5140;
  --road-hi:#8A6C36; --road-mid:#5C4E2F; --road-lo:#3B3527; --river:#2A4654;
  --accent:#D9814F; --accent-t:#EFA679; --focus:#D9814F;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 14px 32px rgba(0,0,0,.34);
}}
:root[data-theme="dark"]{
  --paper:#15130F; --card:#1D1A15; --sunk:#100E0A;
  --ink:#EFE9DB; --ink-2:#ADA48F; --ink-3:#8C8471;
  --dc-shift:#FFF4E2;
  --rule:#312C23; --rule-2:#443D30;
  --sea:#15242C; --sea-line:#39606F; --land:#1B1813;
  --contour:#3A3323; --border-line:#5A5140;
  --road-hi:#8A6C36; --road-mid:#5C4E2F; --road-lo:#3B3527; --river:#2A4654;
  --accent:#D9814F; --accent-t:#EFA679; --focus:#D9814F;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 14px 32px rgba(0,0,0,.34);
}
/* --dc 是圖形用的日色；文字一律用 --dct，標記底色用 --dc-fill，兩者都補足對比 */
[style*="--dc:"],.dayhead,.stops{--dct:color-mix(in srgb,var(--dc) 60%,var(--dc-shift));--dc-fill:color-mix(in srgb,var(--dc) 76%,#150D06)}
*{box-sizing:border-box}
html{height:100%}
/* body 必須隨長行程增高，否則 sticky 頁首會被一個視窗高的容器底部推走。 */
body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.72 var(--sans);-webkit-text-size-adjust:100%;caret-color:var(--accent)}
::selection{background:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:99px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance;line-height:1.36}
a{color:inherit;text-underline-offset:3px;text-decoration-color:var(--rule-2)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ico{width:1em;height:1em;flex:0 0 auto;position:static;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── 頁首 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--rule)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:11px 20px 0;display:flex;flex-direction:column;gap:9px}
.brand{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.brand h1{font-size:17px;letter-spacing:.015em}
.brand .sub{font:400 11.5px/1.5 var(--mono);color:var(--ink-3);letter-spacing:.02em}
.brand .spacer{flex:1 1 auto;min-width:0}
.tabs{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px;scroll-padding-inline:20px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 12px 10px;border-bottom:2px solid transparent;color:var(--ink-3);font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:color .18s var(--ease)}
.tab:hover{color:var(--ink-2)}
.tab .d{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.4;transition:opacity .18s,background .18s}
.tab[aria-selected="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--tc)}
.tab[aria-selected="true"] .d{background:var(--tc);opacity:1}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;color:var(--ink-3);font-size:17px;transition:background .16s,color .16s}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.icon-moon{display:none}
:root[data-theme="dark"] .icon-sun{display:none}
:root[data-theme="dark"] .icon-moon{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .icon-sun{display:none}:root:not([data-theme="light"]) .icon-moon{display:block}}

/* ── 版面 ── */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px 72px}
.split{display:grid;gap:30px}
/* grid 項目預設最小寬度是 min-content，表格的 min-width 會把整欄撐開；歸零才會跟著視窗縮 */
.split>*{min-width:0}
@media (min-width:920px){.split{grid-template-columns:minmax(0,1fr) minmax(400px,44%);align-items:start}}

/* ── 地圖 ── */
.mapwrap{margin:0 -20px 6px;background:var(--paper);padding:10px 0 12px}
@media (min-width:920px){.mapwrap{position:sticky;z-index:30;top:calc(env(safe-area-inset-top,0px) + var(--headh));margin:0;padding:18px 0 0}}
.map{position:relative;margin:0;height:min(40vh,320px);border-block:1px solid var(--rule);background:var(--land);overflow:hidden;
  --mk:21px;--mk-fs:11px;--mk-ico:13px}
@media (min-width:920px){
  .map{height:calc(100dvh - var(--headh) - env(safe-area-inset-top,0px) - 92px);min-height:420px;
       border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow-2);
       --mk:25px;--mk-fs:12px;--mk-ico:15.5px}
}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.map svg.drag{cursor:grabbing}
.map svg text{font-family:var(--sans)}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px}
.pin>*{transition:opacity .3s var(--ease),transform .3s var(--ease)}
.pin .mk{position:relative;width:var(--mk);height:var(--mk);flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  font:500 var(--mk-fs)/1 var(--mono);color:#FFF8EC;background:color-mix(in srgb,var(--pc) 72%,#150D06);
  box-shadow:0 0 0 2.5px var(--card),0 2px 5px rgba(40,28,10,.35)}
.pin .mk .ico{width:var(--mk-ico);height:var(--mk-ico);stroke-width:2;inset:0;margin:auto}
.pin[data-stay="1"] .mk{border-radius:calc(var(--mk) * .28)}
.pin:hover .mk,.pin.on .mk{transform:scale(1.3)}
.pin.on{z-index:6}
.pin .lb{font-size:11.5px;font-weight:500;line-height:1.3;white-space:nowrap;padding:2.5px 7px;border-radius:6px;
  background:color-mix(in srgb,var(--card) 90%,transparent);color:var(--ink);
  box-shadow:0 1px 3px rgba(40,28,10,.16);opacity:0}
.pin.lab .lb,.pin:hover .lb,.pin.on .lb{opacity:1}
.pin.nolb .lb{display:none}
.pin.flip{flex-direction:row-reverse}
.pin.town{cursor:default;gap:4px}
.pin.town .mk{width:4px;height:4px;background:var(--ink-3);box-shadow:none;opacity:.55}
.pin.town .lb{background:none;box-shadow:none;color:var(--ink-3);font-weight:400;font-size:10.5px;padding:0;opacity:1}
.pin.town.nolb .lb{display:none}
.map.anim .pin>*{opacity:0;transform:translateY(-5px)}
.mapbar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px}
.mapbar button{width:32px;height:32px;border-radius:8px;background:color-mix(in srgb,var(--card) 92%,transparent);
  border:1px solid var(--rule);color:var(--ink-2);display:grid;place-items:center;font-size:16px;
  box-shadow:var(--shadow-1);backdrop-filter:blur(8px);transition:color .16s,border-color .16s,background .16s}
.mapbar button:hover{color:var(--ink);border-color:var(--rule-2);background:var(--card)}
.mapbar .ico{stroke-width:1.9}
.mapfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 20px 0;font-size:10.5px;color:var(--ink-3)}
@media (min-width:920px){.mapfoot{padding:9px 2px 0}}
.scalebar{display:flex;align-items:center;gap:7px}
.scaleline{height:7px;border:1px solid var(--rule-2);border-top:0;width:70px}
.mapfoot .sp{flex:1 1 auto}
/* ── 手機：地圖捲出畫面後的浮動按鈕，與地圖燈箱 ── */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;color:#FFF8EC;background:var(--accent);box-shadow:0 4px 14px rgba(40,28,10,.32),0 1px 3px rgba(40,28,10,.2);
  opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease)}
.fab.show{opacity:1;transform:none;pointer-events:auto}
.fab .ico{width:24px;height:24px;stroke-width:1.8}
.fab:active{transform:scale(.94)}
@media (min-width:920px){.fab{display:none}}
dialog.mapdlg{border:0;padding:0;margin:0;background:var(--paper);width:100%;height:100%;max-width:none;max-height:none;color:var(--ink)}
dialog.mapdlg::backdrop{background:rgba(22,17,10,.5)}
dialog.mapdlg[open]{animation:lbin .3s var(--ease)}
.mapdlg-in{display:flex;flex-direction:column;height:100%}
.mapdlg-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 9px 16px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.mapdlg-head h2{font-size:15.5px;min-width:0;display:flex;align-items:center;gap:9px}
.mapdlg-head h2 span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mapdlg-head .bar{width:22px;height:3px;border-radius:2px;background:var(--dc,var(--accent));flex:0 0 auto}
.mapdlg-head .hint{grid-column:1;font-size:11px;color:var(--ink-3);padding-left:31px}
.mapdlg-head .mapdlg-x{grid-column:2;grid-row:1 / span 2}
.mapdlg-x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--sunk);flex:0 0 auto}
.mapdlg-x .ico{width:16px;height:16px;stroke-width:1.9}
.mapdlg-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.mapdlg-body .mapwrap{margin:0;padding:0;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.mapdlg-body .map{flex:1 1 auto;min-height:0;height:auto;border:0;--mk:25px;--mk-fs:12px;--mk-ico:15.5px}
.mapdlg-body .mapfoot{padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));flex:0 0 auto}

/* ── 每日 ── */
.dayhead{padding:16px 0 2px}
.day-title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.day-title-row h2{flex:1;min-width:0}
.map-list-link{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;white-space:nowrap;min-height:44px;padding:9px 13px;border:1px solid var(--rule-2);border-radius:8px;color:var(--dct);font-size:13px;font-weight:500;text-decoration:none}
.map-list-link:hover{background:var(--sunk);border-color:var(--dct)}
.map-list-note{font-size:12px;color:var(--ink-3);margin:8px 0 0}
.dayhead .meta{display:flex;align-items:center;gap:10px;font:400 11.5px/1.5 var(--mono);color:var(--ink-3);letter-spacing:.04em;margin-bottom:8px}
.dayhead .bar{width:28px;height:3px;border-radius:2px;background:var(--dc)}
.dayhead h2{font-size:clamp(22px,3.6vw,29px);letter-spacing:-.005em;margin:0}
.brief{background:var(--sunk);border-radius:10px;padding:11px 14px;margin:0 0 14px}
.brief .tag{display:block;font:500 10.5px/1.6 var(--sans);letter-spacing:.09em;color:var(--dct);margin-bottom:2px}
.brief p{margin:0;font-size:13.5px;color:var(--ink-2)}
.lead{font-size:14.5px;color:var(--ink-2);margin:0;max-width:64ch}

/* ── 時間軸 ── */
.stops{list-style:none;margin:20px 0 0;padding:0}
.stop{position:relative;padding-left:28px}
.stop::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--rule)}
.stop:first-child::before{top:22px}
.stop:last-child::before{bottom:auto;height:22px}
.stop>.row{padding:10px 12px 11px;border-radius:10px;margin-left:-12px;transition:background .25s var(--ease)}
.stop .dot{position:absolute;left:3.5px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--dc);
  box-shadow:0 0 0 3.5px var(--paper);transition:transform .25s var(--ease)}
.stop[data-stay="1"] .dot{border-radius:3px;width:9px;height:9px;left:4px}
.stop.on .dot{transform:scale(1.55)}
.stop.on>.row{background:color-mix(in srgb,var(--dc) 8%,transparent)}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sh time{font:500 12px/1.5 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-3);flex:0 0 auto}
.sh h3{font-size:16.5px;letter-spacing:.005em}
.sh h3 button{font:inherit;text-align:left;transition:color .16s;display:inline-flex;align-items:center;gap:5px}
.sh h3 button .ico{width:13px;height:13px;color:var(--ink-3);transition:transform .2s var(--ease),color .16s}
.sh h3 button:hover{color:var(--dct)}
.sh h3 button:hover .ico{color:var(--dct);transform:translateX(2px)}
.kind{font:500 10.5px/1.6 var(--sans);letter-spacing:.05em;padding:1.5px 7px;border-radius:99px;white-space:nowrap}
.k-main{background:color-mix(in srgb,var(--dc) 16%,transparent);color:var(--dct)}
.k-suggest{background:var(--sunk);color:var(--ink-2)}
.k-optional{box-shadow:inset 0 0 0 1px var(--rule-2);color:var(--ink-3)}
.k-stay{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent-t)}
.k-transit{color:var(--ink-3)}
.slabel{font-size:14.5px;margin:3px 0 0;color:var(--ink)}
.snote{font-size:13px;color:var(--ink-2);margin:4px 0 0;max-width:62ch}
.glink{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3);text-decoration:none;
  margin-top:7px;padding-bottom:2px;border-bottom:1px solid var(--rule);transition:color .16s,border-color .16s}
.glink .ico{width:11px;height:11px}
.glink:hover{color:var(--dct);border-color:currentColor}

/* ── 路段 ── */
.leg{display:flex;flex-wrap:wrap;align-items:center;gap:3px 14px;margin:2px 0 2px -28px;padding:8px 13px 8px 28px;
  background:var(--sunk);border-radius:9px;font-size:12px;color:var(--ink-2)}
.leg .ico{width:13px;height:13px;color:var(--ink-3);margin-right:-7px}
.leg b{font:500 12.5px/1.5 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.leg .k{color:var(--ink-3);font-size:11.5px}
.leg .road{color:var(--ink-3);font-size:11.5px;flex-basis:100%;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.leg a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--rule-2);display:inline-flex;align-items:center;gap:4px;transition:color .16s}
.leg a .ico{width:10px;height:10px;margin:0}
.leg a:hover{color:var(--dct)}

/* ── 摺疊區 ── */
details{margin-top:14px;border-top:1px solid var(--rule)}
details>summary{list-style:none;cursor:pointer;padding:11px 0;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px;transition:color .16s}
details>summary::-webkit-details-marker{display:none}
details>summary .ico{width:13px;height:13px;color:var(--ink-3);transition:transform .22s var(--ease)}
details[open]>summary .ico{transform:rotate(180deg)}
details>summary:hover{color:var(--ink)}
details>summary .n{font:400 11px/1.5 var(--mono);color:var(--ink-3);margin-left:auto}
.alt{padding:2px 0 14px}
.alt+.alt{border-top:1px solid var(--rule)}
.alt h4{font-size:13.5px;margin:10px 0 3px}
.alt p{font-size:13px;color:var(--ink-2);margin:0;max-width:62ch}
.altspots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meals{margin:30px 0;border-top:1px solid var(--rule);padding-top:24px;scroll-margin-top:130px}
.meals h3{margin:0 0 10px;font:600 23px/1.4 var(--serif)}
.meal-policy,.meal-fallback,.meal-venue p,.cooking p{font-size:13px;color:var(--ink-2)}
.meal-row{padding:22px 0;border-bottom:1px solid var(--rule)}
.meal-row h4{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin:0;font-size:17px}
.meal-row time{font-size:12px;font-weight:400;color:var(--ink-2)}
.meal-row p{margin:8px 0}
.meal-venues{list-style:none;margin:14px 0;padding:0}
.meal-venue{padding:10px 0}
.meal-venue button{text-align:left;color:var(--accent);font-weight:600;min-height:36px;text-decoration:underline;text-underline-offset:4px}
.meal-venue button .ico{margin-left:5px}
.meal-venue .meal-facts{color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}
.meal-tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 7px;background:var(--sunk);color:var(--ink);margin-left:7px}
.meal-jump{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);text-underline-offset:4px;font-size:13px}
.pin[data-dining="1"] .mk{border-radius:4px;background:var(--card);color:var(--ink);border:1px solid var(--pc);font-size:11px}
.meal-legend{font-size:12px;color:var(--ink-2);margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px 5px 9px;border-radius:99px;font-size:12.5px;font-weight:500;color:var(--ink);
  background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rule);text-decoration:none;transition:background .16s,color .16s,box-shadow .16s}
.chip .ico{width:12px;height:12px;color:var(--ink-3)}
.chip:hover{background:color-mix(in srgb,var(--dc) 12%,var(--sunk));color:var(--dct);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dc) 40%,var(--rule))}
.chip:hover .ico{color:var(--dct)}
.cautions{margin:0;padding:0 0 14px 2px;list-style:none}
.cautions li{font-size:13px;color:var(--ink-2);margin-bottom:7px;display:flex;gap:9px;align-items:flex-start}
.cautions .ico{width:14px;height:14px;color:var(--ink-3);margin-top:4px}

/* ── 總覽 ── */
.ov section{padding:26px 0;border-top:1px solid var(--rule)}
.ov section:first-child{border-top:0;padding-top:16px}
.ov h3{font-size:16px;margin-bottom:4px}
.ov .hint{font-size:12.5px;color:var(--ink-3);margin:0 0 16px;max-width:64ch}
.rail{display:grid;gap:3px;margin-bottom:14px}
.railbar{display:grid;height:26px;gap:3px;border-radius:7px;overflow:hidden}
.railseg{display:flex;align-items:center;justify-content:center;gap:5px;font:500 11px/1 var(--mono);
  color:#FFF8EC;background:color-mix(in srgb,var(--sc) 72%,#150D06);transition:filter .16s}
.railseg:hover{filter:brightness(1.12)}
.railseg .ico{width:11px;height:11px}
.raildates{display:flex;justify-content:space-between;font:400 10.5px/1.5 var(--mono);color:var(--ink-3)}
.staylist{display:grid;gap:0}
.stayrow{padding:14px 0;border-top:1px solid var(--rule)}
.stayrow .nm{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.stayrow .sw{width:8px;height:8px;border-radius:2.5px;background:var(--sc);flex:0 0 auto}
.stayrow h4{font-size:15px}
.stayrow h4 button{font:inherit;text-align:left;transition:color .16s}
.stayrow h4 button:hover{color:color-mix(in srgb,var(--sc) 60%,var(--dc-shift))}
.stayrow .nights{font:500 10.5px/1.6 var(--mono);color:var(--ink-3);margin-left:auto;white-space:nowrap}
.stayrow .det{display:flex;flex-wrap:wrap;gap:2px 18px;align-items:baseline;padding-left:17px}
.stayrow .facts{font-size:12.5px;color:var(--ink-2);flex:1 1 15rem;margin:0}
.stayrow .facts span+span::before{content:"・";color:var(--ink-3);margin:0 2px}
.stayrow .when{font:400 11px/1.7 var(--mono);color:var(--ink-3);white-space:nowrap;margin:0;flex:0 0 auto}
.tablewrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
.mobile-field-label{display:none}
@media (max-width:639px){
  .ov .tablewrap{overflow:visible;margin:0;padding:0}
  .ov .overview-table{display:block;min-width:0;font-size:14px}
  .overview-table thead{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .overview-table tbody{display:block}
  .overview-table tbody tr{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:16px 0;border-bottom:1px solid var(--rule)}
  .ov .overview-table td{display:block;padding:0;border:0;min-width:0;overflow-wrap:anywhere}
  .ov .overview-table .entry-date{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
  .entry-date br{display:none}
  .ov .overview-table .lk{display:flex;align-items:center;min-height:44px;font-size:16px;line-height:1.5}
  .ov .overview-table .dchip{font-size:12px;white-space:normal}
  .overview-table .mobile-field-label{display:inline;color:var(--ink-3);font-size:12px}
}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
th{text-align:left;font:500 10.5px/1.6 var(--sans);letter-spacing:.07em;color:var(--ink-3);
  border-bottom:1px solid var(--rule-2);padding:0 14px 8px 0;white-space:nowrap}
td{padding:10px 14px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
tbody tr{transition:background .16s}
tbody tr:hover{background:var(--sunk)}
td .lk{font-weight:500;color:var(--ink);text-align:left;transition:color .16s}
td .lk:hover{color:var(--accent-t)}
td .dchip{font:400 11px/1.5 var(--mono);color:var(--ink-3);white-space:nowrap}
td .dnum{font:500 11px/1.5 var(--mono);color:color-mix(in srgb,var(--dc) 60%,var(--dc-shift))}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:11px;align-items:flex-start;padding:8px 10px;border-radius:8px;transition:background .16s}
.checks li:hover{background:var(--sunk)}
.checks input{margin:4px 0 0;accent-color:var(--accent);width:15px;height:15px;flex:0 0 auto}
.checks label{font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:color .16s}
.checks input:checked+label{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule-2)}
.progress{display:flex;align-items:center;gap:9px;font:400 11px/1.6 var(--mono);color:var(--ink-3);margin-bottom:10px}
.ptrack{flex:1 1 auto;max-width:160px;height:3px;border-radius:2px;background:var(--rule)}
.pfill{height:100%;width:100%;border-radius:2px;background:var(--accent);transform-origin:left center;
  transform:scaleX(0);transition:transform .35s var(--ease)}
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink-3);max-width:68ch}
.foot p{margin:0 0 7px}

/* ── 詳細燈箱 ── */
html:has(dialog.lb[open]){overflow:hidden}
dialog.lb{border:0;padding:0;margin:0;background:transparent;width:100%;height:100%;max-width:none;max-height:none;color:var(--ink)}
dialog.lb::backdrop{background:rgba(22,17,10,.6);backdrop-filter:blur(3px)}
dialog.lb[open]{animation:lbin .34s var(--ease)}
dialog.lb[open]::backdrop{animation:lbfade .34s ease}
@keyframes lbin{from{opacity:0;transform:translateY(10px)}}
@keyframes lbfade{from{opacity:0}}
.lb-in{position:relative;background:var(--card);width:100%;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:640px){.lb-in{width:min(100%,760px);height:auto;max-height:92dvh;margin:4dvh auto;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.4)}}
.lb-x{position:absolute;right:10px;top:10px;z-index:3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink);
  background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(8px);box-shadow:var(--shadow-1);transition:background .16s}
.lb-x:hover{background:var(--card)}
.lb-x .ico{width:16px;height:16px;stroke-width:1.9}
.lb-slider{position:relative;background:var(--sunk);aspect-ratio:3/2;flex:0 0 auto;min-height:0;max-height:46dvh}
.lb-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.lb-track::-webkit-scrollbar{display:none}
.lb-track figure{flex:0 0 100%;margin:0;scroll-snap-align:start;position:relative;height:100%}
.lb-track img{width:100%;height:100%;object-fit:cover;display:block;background:var(--sunk)}
.lb-track figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 9px;font-size:10.5px;line-height:1.4;color:#FFF3E2;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.lb-track figcaption a{color:inherit;text-decoration-color:rgba(255,243,226,.5)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);
  background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(8px);box-shadow:var(--shadow-1);transition:background .16s,transform .16s}
.lb-nav:hover{background:var(--card)}
.lb-nav:active{transform:translateY(-50%) scale(.94)}
.lb-nav .ico{width:17px;height:17px;stroke-width:1.9}
.lb-nav.prev{left:10px}.lb-nav.prev .ico{transform:rotate(90deg)}
.lb-nav.next{right:10px}.lb-nav.next .ico{transform:rotate(-90deg)}
.lb-dots{position:absolute;bottom:38px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.lb-dots i{width:6px;height:6px;border-radius:50%;background:#FFF3E2;opacity:.45;transition:opacity .2s,transform .2s;box-shadow:0 0 2px rgba(0,0,0,.4)}
.lb-dots i.on{opacity:1;transform:scale(1.35)}
.lb-nophoto{height:100%;display:grid;place-items:center;color:var(--ink-3);font-size:12.5px;text-align:center;padding:20px;line-height:1.7}
.lb-body{overflow-y:auto;padding:18px 20px 26px;overscroll-behavior:contain;flex:1 1 auto}
.lb-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-right:36px}
.lb-head h2{font-size:22px;letter-spacing:-.005em}
.lb-jp{font:400 12px/1.5 var(--mono);color:var(--ink-3);margin:1px 0 0}
.lb-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lb-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--sunk);font-size:12.5px;color:var(--ink-2)}
.lb-chip .ico{width:13px;height:13px;color:var(--ink-3)}
.lb-chip.day{font-family:var(--mono);font-size:11.5px;color:var(--dct);background:color-mix(in srgb,var(--dc) 14%,transparent)}
.lb-summary{font-size:14.5px;color:var(--ink);margin:16px 0 0;max-width:62ch}
.lb-h{font:500 10.5px/1.6 var(--sans);letter-spacing:.09em;color:var(--ink-3);margin:20px 0 7px}
.lb-hl{margin:0;padding:0 0 0 18px}
.lb-hl li{font-size:13.5px;color:var(--ink-2);margin-bottom:6px;max-width:62ch}
.lb-hl li::marker{color:var(--rule-2)}
.lb-info{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.lb-info dt{color:var(--ink-3);white-space:nowrap}
.lb-info dd{margin:0;color:var(--ink-2)}
.lb-refs{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.lb-refs a{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:1px;transition:color .16s,border-color .16s}
.lb-refs a:hover{color:var(--accent-t);border-color:currentColor}
.lb-refs .ico{width:12px;height:12px;color:var(--ink-3)}
.lb-foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--rule);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.lb-note{font-size:11px;color:var(--ink-3);margin:14px 0 0;max-width:62ch}
@media (prefers-reduced-motion:reduce){dialog.lb[open],dialog.lb[open]::backdrop{animation:none}}

/* ── 進場 ── */
.panel-in>*{animation:rise .5s var(--ease) both}
.panel-in.first>*{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .map.anim .pin>*{opacity:1;transform:none}}

  if (!points.length) return;
  const xs = [], ys = [];
  points.forEach((p) => { const q = prj(p.lng, p.lat); xs.push(q[0]); ys.push(-q[1]); });
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const r = svg.getBoundingClientRect(), ar = (r.width || 600) / (r.height || 400);
  const pad = padRatio == null ? .3 : padRatio;
  let w = Math.max(x1 - x0, .012) * (1 + pad * 2);
  let h = Math.max(y1 - y0, .012) * (1 + pad * 2);
  if (w / h < ar) w = h * ar; else h = w / ar;
  fitTarget = { x:(x0 + x1) / 2 - w / 2, y:(y0 + y1) / 2 - h / 2, w, h };
  setView(fitTarget);
}
function zoom(k, cx, cy) {
  const r = svg.getBoundingClientRect();
  const fx = cx == null ? .5 : (cx - r.left) / r.width;
  const fy = cy == null ? .5 : (cy - r.top) / r.height;
  const w = Math.min(Math.max(view.w * k, .004), 4), h = w * (view.h / view.w);
  setView({ x:view.x + (view.w - w) * fx, y:view.y + (view.h - h) * fy, w, h });
}
function drawScale() {
  const r = svg.getBoundingClientRect();
  if (!r.width) return;
  const kmPerDeg = 111.32 * Math.cos(38.4 * R);
  const kmPerPx = view.w * kmPerDeg / r.width;
  const nice = [1, 2, 5, 10, 20, 50, 100, 200];
  let pick = nice[0];
  for (const n of nice) { pick = n; if (n / kmPerPx >= 62) break; }
  $('#scaleline').style.width = Math.round(pick / kmPerPx) + 'px';
  $('#scaletext').textContent = pick + ' km';
}

function placePins() {
  const r = svg.getBoundingClientRect();
  if (!r.width) return;
  const all = pins.concat(townPins);
  all.forEach((pin) => {
    const q = prj(pin.p.lng, pin.p.lat);
    const px = (q[0] - view.x) / view.w * r.width;
    const py = (-q[1] - view.y) / view.h * r.height;
    const off = px < -60 || px > r.width + 60 || py < -40 || py > r.height + 40;
    pin.node.style.display = off ? 'none' : '';
    pin.node.style.left = px.toFixed(1) + 'px';
    pin.node.style.top = py.toFixed(1) + 'px';
    pin.node.classList.toggle('flip', px > r.width * .6);
  });
  if (routeLayer) routeLayer.setAttribute('stroke-dasharray', (view.w * .011).toFixed(4) + ' ' + (view.w * .0085).toFixed(4));
  layoutLabels();
}

/* 標籤避讓：選取中 > 住宿 > 行程順序 > 城鎮 */
function layoutLabels() {
  const host = pinsBox.getBoundingClientRect();
  if (!host.width) return;
  const rel = (b) => ({ l:b.left - host.left, t:b.top - host.top, r:b.right - host.left, b:b.bottom - host.top });
  const hits = (a, b) => !(a.r < b.l - 3 || a.l > b.r + 3 || a.b < b.t - 3 || a.t > b.b + 3);
  const all = pins.concat(townPins);
  const vis = all.filter((p) => p.node.style.display !== 'none');
  vis.forEach((p) => p.node.classList.remove('nolb'));
  const taken = pins.filter((p) => p.node.style.display !== 'none').map((p) => rel($('.mk', p.node).getBoundingClientRect()));
  vis.map((p, i) => ({ p, i }))
    .sort((a, b) => {
      const s = (x) => (x.p.key === active ? 8 : 0) + (x.p.town ? -4 : 0)
        + (x.p.node.dataset.stay ? 2 : 0) + (x.p.node.classList.contains('lab') ? 1 : 0);
      return s(b) - s(a) || a.i - b.i;
    })
    .forEach(({ p }) => {
      if (!p.node.classList.contains('lab') && p.key !== active) return;
      const box = rel($('.lb', p.node).getBoundingClientRect());
      if (taken.some((t) => hits(box, t))) p.node.classList.add('nolb'); else taken.push(box);
    });
}

/* 拖曳、滾輪與雙指縮放 */
let drag = null, pinchD = 0;
svg.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch' && e.isPrimary === false) return;
  drag = { x:e.clientX, y:e.clientY, id:e.pointerId };
  svg.setPointerCapture(e.pointerId); svg.classList.add('drag');
});
svg.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const r = svg.getBoundingClientRect();
  setView({ x:view.x - (e.clientX - drag.x) / r.width * view.w, y:view.y - (e.clientY - drag.y) / r.height * view.h, w:view.w, h:view.h });
  drag.x = e.clientX; drag.y = e.clientY;
});
const endDrag = (e) => { if (drag && e.pointerId === drag.id) { drag = null; svg.classList.remove('drag'); } };
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('wheel', (e) => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.18 : 1 / 1.18, e.clientX, e.clientY); }, { passive:false });
svg.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const a = e.touches[0], b = e.touches[1];
  const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  if (pinchD) zoom(pinchD / dist, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
  pinchD = dist;
}, { passive:false });
svg.addEventListener('touchend', () => { pinchD = 0; });
$('#zin').onclick = () => zoom(1 / 1.5);
$('#zout').onclick = () => zoom(1.5);
$('#zfit').onclick = () => { if (fitTarget) setView(fitTarget); };

let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => fitTo(currentPoints, currentPad), 140); });

/* ── 手機：地圖捲出畫面後浮出按鈕，按下把同一個地圖搬進全螢幕燈箱 ── */

/* 把地圖搬回原位。可重複呼叫；不依賴 dialog 的 close 事件（有些瀏覽器不會發） */

/* 地圖整個離開視窗（被捲到頁首上方）才顯示按鈕；桌機與燈箱開啟時不顯示。
   直接量地圖位置，不依賴 IntersectionObserver 的回呼時機 */
function updateFab() {
  const gone = !mapInDialog() && mapBox.getBoundingClientRect().bottom < 0;
  fab.classList.toggle('show', isPhone() && gone && !$('#lb').open);
}
let fabTick = false;
function armFab() {
  if (fabArmed) return; fabArmed = true;
  const onScroll = () => { if (fabTick) return; fabTick = true; requestAnimationFrame(() => { fabTick = false; updateFab(); }); };
  addEventListener('scroll', onScroll, { passive: true });

}

/* ── 依分頁畫標記與連線 ── */
function renderMap(day) {
  pinsBox.textContent = '';
  routeLayer.textContent = '';
  pins = []; townPins = [];
  const color = day ? day.color : 'var(--accent)';

  BASEMAP.towns.forEach((t) => {
    const node = el('div', 'pin town');
    node.appendChild(el('div', 'mk'));
    node.appendChild(el('div', 'lb', t.n));
    node.setAttribute('aria-hidden', 'true');
    pinsBox.appendChild(node);
    townPins.push({ p:{ lng:t.x, lat:t.y }, node, key:'town:' + t.n, town:true });
  });

  const seq = [], seen = {};
  const push = (key, stay) => { if (seen[key]) return; seen[key] = 1; seq.push({ key, stay }); };
  if (day) day.stops.forEach((s) => push(s.place, s.kind === 'stay'));
  else OVERVIEW_ROUTE.forEach((k) => push(k, PLACES[k].cat === 'stay'));

  const pts = seq.map((s) => PLACES[s.key]);
  if (pts.length > 1) {
    routeLayer.appendChild(shape('path', {
      d: d(pts.map((p) => [p.lng, p.lat])), fill:'none', stroke:color, 'stroke-width':2.2, opacity:.7,
      'stroke-linejoin':'round', 'stroke-linecap':'round', 'vector-effect':'non-scaling-stroke',
    }));
  }
  // 候選餐廳／超市只加標記，不接到主路線上。
  if (day) (day.meals || []).forEach(meal => {
    [...meal.places, ...(meal.backupPlaces || [])].forEach(key => {
      if (!seen[key]) { push(key, PLACES[key].cat === 'stay'); pts.push(PLACES[key]); }
    });
  });
  seq.forEach((s, i) => {
    const p = PLACES[s.key];
    const diningPin = !!DINING.venues[s.key];
    const node = el('div', 'pin' + (s.stay || !day ? ' lab' : ''));
    node.style.setProperty('--pc', color);
    if (s.stay) node.dataset.stay = '1';
    if (diningPin) node.dataset.dining = '1';
    const mk = el('div', 'mk');
    if (s.stay) mk.innerHTML = ico('i-bed');
    else if (diningPin) mk.textContent = p.cat === 'shop' ? '購' : '餐';
    else mk.textContent = String(i + 1);
    node.appendChild(mk);
    node.appendChild(el('div', 'lb', p.name));
    node.tabIndex = 0;
    node.setAttribute('role', 'button');
    node.setAttribute('aria-label', p.name + (diningPin ? '，查看餐食詳細資訊' : '，在行程中檢視'));
    const go = () => {
      if (diningPin) {
        if (mapInDialog()) { closeMapDialog(); setTimeout(() => openDetail(s.key, fab), 60); }
        else openDetail(s.key, node);
        return;
      }
      if (mapInDialog()) { closeMapDialog(); setTimeout(() => focusPlace(s.key, { zoom:true, scroll:true }), 60); }
      else focusPlace(s.key, { zoom:true, scroll:true });
    };
    node.onclick = go;
    node.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    node.style.transitionDelay = Math.min(i * 34, 500) + 'ms';
    pinsBox.appendChild(node);
    pins.push({ p, node, key:s.key });
  });

  currentPoints = pts; currentPad = day ? .34 : .16;
  fitTo(pts, currentPad);

  // 當日路線逐點落下，是這頁唯一一段刻意的動態
  if (!reduced()) {
    mapBox.classList.add('anim');
    requestAnimationFrame(() => requestAnimationFrame(() => mapBox.classList.remove('anim')));
  }
}

let suppressSpy = 0;
function focusPlace(key, opt) {
  opt = opt || {};
  active = key;
  pins.forEach((pin) => {
    const on = pin.key === key;
    pin.node.classList.toggle('on', on);
    if (on) pin.node.classList.remove('nolb');
  });
  document.querySelectorAll('.stop').forEach((n) => n.classList.toggle('on', n.dataset.place === key));
  const p = PLACES[key];
  if (p) {
    const q = prj(p.lng, p.lat), cx = q[0], cy = -q[1];
    const inside = cx > view.x + view.w * .12 && cx < view.x + view.w * .88
                && cy > view.y + view.h * .12 && cy < view.y + view.h * .88;
    if (opt.zoom) {
      const w = Math.min(view.w, .085), h = w * (view.h / view.w);
      setView({ x:cx - w / 2, y:cy - h / 2, w, h });
    } else if (!inside) {
      setView({ x:cx - view.w / 2, y:cy - view.h / 2, w:view.w, h:view.h });
    } else {
      layoutLabels();
    }
  }
  if (opt.scroll) {
    const t = document.querySelector('.stop[data-place="' + CSS.escape(key) + '"]');
    if (t) {
      suppressSpy = Date.now() + 700;
      t.scrollIntoView({ block:'center', behavior: reduced() ? 'auto' : 'smooth' });
    }
  }
}

/* 捲動時自動點亮地圖上對應的點 */
let spy = null;
function startSpy() {
  if (spy) spy.disconnect();
  const topPct = Math.min(70, Math.round(130 / innerHeight * 100) + 6);
  spy = new IntersectionObserver((entries) => {
    if (Date.now() < suppressSpy) return;
    const hit = entries.filter((e) => e.isIntersecting)
      .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (hit) focusPlace(hit.target.dataset.place, {});
  }, { rootMargin: `-${topPct}% 0px -${Math.max(12, 94 - topPct)}% 0px`, threshold:0 });
  document.querySelectorAll('.stop').forEach((n) => spy.observe(n));
}

  h += '<section><h3>餐食與訂位</h3><p class="hint">餐廳目前尚未預約；每天的餐點選擇、預算與備案請見詳細行程。</p>'
    + '<ul class="cautions"><li>優先：10/17 11:00 利久牛舌、10/16 11:45 さんとり茶屋午餐。現在可先詢問，尚未確認五人空位；出發前一週再確認。</li>'
    + '<li>10/12 國定假日：焰藏先問營業與候位，平田牧場晚餐建議訂位；不要把不同分店的規則混用。</li>'
    + '<li>10/13 推薦山形壽喜燒自煮，五人食材約 ¥6,000–9,000；鍋具先問房東。10/16 鹽釜可再選一晚自煮或超市熟食。</li></ul>'
    + '<div class="altspots"><button type="button" class="chip" data-detail="rikyu">牛舌店詳情</button><button type="button" class="chip" data-detail="santori">さんとり茶屋詳情</button><button type="button" class="chip" data-day="3">查看自煮日</button></div></section>';
  h += '<section><h3>六個晚上，三個落腳處</h3>'
    + '<p class="hint">入住日期、地址、餐食與入住退房時間，已於 2026/09/17 核對 Booking 訂單。色塊寬度就是住幾晚——山形三晚是這趟的重心。</p>'
    + '<div class="rail"><div class="railbar" style="grid-template-columns:' + STAYS.map((s) => s.nights + 'fr').join(' ') + '">'
    + STAYS.map((s, i) => '<button type="button" class="railseg" data-detail="' + esc(s.place) + '" style="--sc:' + DAYS[i === 0 ? 0 : (i === 1 ? 3 : 4)].color + '">'
      + ico('i-bed') + s.nights + ' 晚</button>').join('')
    + '</div><div class="raildates"><span>10/11 抵達</span><span>共 ' + total + ' 晚</span><span>10/17 返程</span></div></div>'
    + '<div class="staylist">'
    + STAYS.map((s, i) => {
      const p = PLACES[s.place], c = DAYS[i === 0 ? 0 : (i === 1 ? 3 : 4)].color;
      return '<div class="stayrow" style="--sc:' + c + '">'
        + '<div class="nm"><span class="sw"></span><h4><button type="button" data-detail="' + esc(s.place) + '">' + esc(p.name) + '</button></h4>'
        + '<span class="nights">' + s.nights + ' 晚</span></div>'
        + '<div class="det"><p class="facts"><span>' + esc(s.meals) + '</span><span>' + esc(s.role) + '</span></p>'
        + '<p class="when">' + esc(s.check) + '</p></div></div>';
    }).join('') + '</div></section>';

  h += '<section><h3>七天主軸</h3><p class="hint">點任一天可切換到該日的詳細行程與地圖。</p><div class="tablewrap"><table class="overview-table days-table" role="table" aria-label="七天主軸">'
    + '<thead role="rowgroup"><tr role="row"><th role="columnheader" scope="col">日期</th><th role="columnheader" scope="col">主題</th><th role="columnheader" scope="col">過夜</th></tr></thead><tbody role="rowgroup">'
    + DAYS.map((dy) => '<tr role="row"><td role="cell" class="entry-date"><span class="dnum" style="--dc:' + dy.color + '">Day ' + dy.id + '</span><br><span class="dchip">' + esc(dy.date) + '</span></td>'
      + '<td role="cell"><button type="button" class="lk" data-day="' + dy.id + '">' + esc(dy.title) + '</button></td>'
      + '<td role="cell"><span class="mobile-field-label" aria-hidden="true">' + (dy.id === DAYS[DAYS.length - 1].id ? '返程：' : '住宿：') + '</span>' + esc(PLACES[dy.stops[dy.stops.length - 1].place].name) + '</td></tr>').join('')
    + '</tbody></table></div></section>';

  h += '<section><h3>加點建議：為什麼放在這一天</h3>'
    + '<p class="hint">這些都不是家人已指定的必去點。時間不夠就先砍這裡，不要砍主軸。</p><div class="tablewrap"><table class="overview-table addons-table" role="table" aria-label="加點建議">'
    + '<thead role="rowgroup"><tr role="row"><th role="columnheader" scope="col">加點</th><th role="columnheader" scope="col">日期</th><th role="columnheader" scope="col">位置與價值</th><th role="columnheader" scope="col">約需時間</th></tr></thead><tbody role="rowgroup">'
    + ADDONS.map((a) => '<tr role="row"><td role="cell"><button type="button" class="lk" data-detail="' + esc(a.place) + '">' + esc(PLACES[a.place].name) + '</button></td>'
      + '<td role="cell" class="entry-date"><span class="dchip">' + esc(a.day) + '</span></td><td role="cell">' + esc(a.why) + '</td><td role="cell"><span class="mobile-field-label" aria-hidden="true">約需時間：</span><span class="dchip">' + esc(a.cost) + '</span></td></tr>').join('')
    + '</tbody></table></div></section>';

  h += '<section><h3>行前需要補齊的資料</h3>'
    + '<div class="progress"><span id="ptext">0 / ' + CHECKLIST.length + '</span><span class="ptrack"><span class="pfill" id="pfill"></span></span></div>'
    + '<p class="hint">勾選狀態只存在這台裝置的瀏覽器，不會同步到手機或其他人。</p><ul class="checks">'
    + CHECKLIST.map((c, i) => '<li><input type="checkbox" id="ck' + i + '"><label for="ck' + i + '">' + esc(c) + '</label></li>').join('')
    + '</ul></section>';

  h += '<div class="foot">'
    + '<p>距離與車程來自 2026/09/17 於 Google Maps 查詢公開地標之間的道路路線，不是直線距離，也不是 10 月旅遊當日的路況預報。車程不含休息、找車位、從停車場步行、景區接駁或臨時管制。</p>'
    + '<p>地圖為 OpenStreetMap 圖資（© OpenStreetMap 貢獻者，ODbL）與国土地理院高程資料繪製。點與點之間的虛線只表示造訪順序與相對位置，不是實際行車路線。</p>'
    + '<p>航班：星宇航空 10/11 11:35→16:00、10/17 17:20→20:10；租車：仙台機場取還，Nissan Serena。本頁不收錄訂單確認碼或門鎖密碼。</p>'
    + '</div></div>';
  return h;
}

/* ── 詳細燈箱 ── */
const lb = $('#lb'), lbTrack = $('#lbTrack'), lbDots = $('#lbDots'), lbBody = $('#lbBody');
const lbPrev = $('#lbPrev'), lbNext = $('#lbNext');
let lbOpener = null;
const md = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

/* 這個地點在行程裡扮演什麼角色、出現在哪幾天 */
function roleOf(key) {
  const days = [], kinds = [];
  DAYS.forEach((dy) => {
    const hit = dy.stops.find((st) => st.place === key);
    if (hit) { days.push(dy); kinds.push(hit.kind); }
    else if ((dy.meals || []).some(m => [...m.places, ...(m.backupPlaces || [])].includes(key))) { days.push(dy); kinds.push('suggest'); }
    else if ((dy.alts || []).some((a) => a.place === key || (a.places || []).includes(key))) { days.push(dy); kinds.push('alt'); }
  });
  const kind = kinds.find((k) => k === 'main') || kinds.find((k) => k === 'stay') || kinds[0] || 'alt';
  return { days, kind };
}

function openDetail(key, opener) {
  const p = PLACES[key], d = DETAILS[key];
  if (!p || !d) return;
  lbOpener = opener || document.activeElement;
  const photos = PHOTOS[key] || [];
  // 沒有餐廳照片時直接呈現菜單與訂位資訊，不佔半個螢幕留白。
  lbTrack.closest('.lb-slider').hidden = !!d.dining && photos.length === 0;

  lbTrack.innerHTML = photos.length
    ? photos.map((ph, i) => '<figure><img src="' + esc(ph.src) + '" alt="' + esc(p.name) + '" loading="' + (i ? 'lazy' : 'eager') + '" decoding="async">'
        + '<figcaption>' + esc(ph.credit) + (ph.page ? '・<a href="' + esc(ph.page) + '" target="_blank" rel="noopener">' + (ph.commons ? 'Wikimedia Commons' : '來源') + '</a>' : '') + '</figcaption></figure>').join('')
    : '<div class="lb-nophoto">這個地點沒有可用的免費授權照片。<br>參考連結裡的官方網站有相簿。</div>';
  lbDots.innerHTML = photos.length > 1 ? photos.map((_, i) => '<i' + (i ? '' : ' class="on"') + '></i>').join('') : '';
  lbPrev.hidden = lbNext.hidden = photos.length < 2;

  const role = roleOf(key);
  const color = role.days[0] ? role.days[0].color : 'var(--accent)';
  lbBody.innerHTML = '<div style="--dc:' + color + '">'
    + '<div class="lb-head"><h2 id="lbTitle">' + esc(p.name) + '</h2><span class="kind k-' + role.kind + '">' + KIND[role.kind] + '</span></div>'
    + (p.jp && p.jp !== p.name ? '<p class="lb-jp">' + esc(p.jp) + '</p>' : '')
    + '<div class="lb-meta"><span class="lb-chip">' + ico('i-clock') + esc(d.stay) + '</span>'
    + role.days.map((dy) => '<span class="lb-chip day" style="--dc:' + dy.color + '">' + ico('i-cal') + 'Day ' + dy.id + '・' + esc(dy.date.slice(0, 5)) + '</span>').join('')
    + '</div>'
    + '<p class="lb-summary">' + md(d.summary) + '</p>'
    + '<div class="lb-h">' + (d.dining ? '吃什麼・怎麼安排' : '看點') + '</div><ul class="lb-hl">' + d.highlights.map((h) => '<li>' + md(h) + '</li>').join('') + '</ul>'
    + (d.info && d.info.length ? '<div class="lb-h">實用資訊</div><dl class="lb-info">' + d.info.map((r) => '<dt>' + esc(r[0]) + '</dt><dd>' + md(r[1]) + '</dd>').join('') + '</dl>' : '')
    + '<div class="lb-h">參考資料</div><ul class="lb-refs">' + d.refs.map((r) => '<li><a href="' + esc(r.u) + '" target="_blank" rel="noopener">' + esc(r.t) + ico('i-ext') + '</a></li>').join('') + '</ul>'
    + '<div class="lb-foot"><a class="glink" href="' + esc(mapsUrl(p)) + '" target="_blank" rel="noopener">在 Google Maps 開啟' + ico('i-ext') + '</a>'
    + (p.note ? '<span class="lb-note" style="margin:0">' + esc(p.note) + '</span>' : '') + '</div>'
    + '<p class="lb-note">' + (d.dining ? '餐食資料於 ' + esc(DINING.checked) + ' 整理，官網與搜尋摘要層級見參考資料；預算是規劃估算。尚未電話確認或訂位，出發前重查。' : '景點資料依官方網站與維基百科整理（2026/09/17 查閱）；營業與費用可能變動，出發前以官網為準。') + ' 照片來源標於各張下方，僅供家人旅行參考。</p>'
    + '</div>';

  if (!lb.open) lb.showModal();
  fab.classList.remove('show');
  // dialog 未顯示時設定 scrollLeft 不會生效，要在 showModal 之後、且等版面算好再歸零；
  // scroll-snap 也可能把舊位置吸回去，所以連續兩個 frame 都設一次
  const rewind = () => { lbTrack.scrollTo({ left: 0, behavior: 'auto' }); lbBody.scrollTop = 0; markDot(0); };
  rewind(); requestAnimationFrame(() => { rewind(); requestAnimationFrame(rewind); });
  // file:// 或 data: 來源不允許改網址，失敗就略過，不影響燈箱本身
  try { if (location.hash !== '#p=' + key) history.replaceState(null, '', '#p=' + key); } catch (e) {}
  lb.focus();
}
/* 關閉後的收尾。可重複呼叫；不依賴 dialog 的 close 事件 */
function afterDetailClose() {
  updateFab();
  try { if (/^#p=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  lbTrack.innerHTML = '';
  if (lbOpener && lbOpener.focus && document.contains(lbOpener)) lbOpener.focus();
  lbOpener = null;
}
function closeDetail() { if (lb.open) lb.close(); afterDetailClose(); }
lb.addEventListener('close', afterDetailClose);
lb.addEventListener('cancel', (e) => { e.preventDefault(); closeDetail(); });
lb.addEventListener('click', (e) => { if (e.target === lb) closeDetail(); });
$('#lbClose').onclick = closeDetail;

/* 相片滑動 */
const slideCount = () => lbTrack.children.length;
const curSlide = () => Math.round(lbTrack.scrollLeft / Math.max(1, lbTrack.clientWidth));
const slideTo = (i) => {
  const n = slideCount(); if (!n) return;
  const k = ((i % n) + n) % n;
  lbTrack.scrollTo({ left: k * lbTrack.clientWidth, behavior: reduced() ? 'auto' : 'smooth' });
};
lbPrev.onclick = () => slideTo(curSlide() - 1);
lbNext.onclick = () => slideTo(curSlide() + 1);
const markDot = (i) => [].forEach.call(lbDots.children, (dot, j) => dot.classList.toggle('on', j === i));
lbTrack.addEventListener('scroll', () => markDot(curSlide()), { passive: true });
lb.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); slideTo(curSlide() - 1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); slideTo(curSlide() + 1); }
});

/* 網址 #p=地點 直接開燈箱，家人可以分享單一景點 */
function openFromHash() {
  const m = location.hash.match(/^#p=([A-Za-z0-9_]+)$/);
  if (m && DETAILS[m[1]]) openDetail(m[1], null);
  else if (!m) closeDetail();
}
addEventListener('hashchange', openFromHash);

/* ── 分頁 ── */
const tabsBox = $('#tabs');
let cur = 0, firstRender = true;
function buildTabs() {
  const mk = (id, label, color) => {
    const b = el('button', 'tab');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.id = 'tab-' + id;
    b.setAttribute('aria-controls', 'panel');
    b.dataset.day = id;
    b.style.setProperty('--tc', color);
    b.appendChild(el('span', 'd'));
    b.appendChild(el('span', null, label));
    b.onclick = () => show(id);
    tabsBox.appendChild(b);
  };
  mk(0, '全程總覽', 'var(--accent)');
  DAYS.forEach((dy) => mk(dy.id, 'Day ' + dy.id + '　' + dy.date.slice(0, 5), dy.color));
}
tabsBox.addEventListener('keydown', (e) => {
  const step = { ArrowRight:1, ArrowLeft:-1, Home:-99, End:99 }[e.key];
  if (step == null) return;
  e.preventDefault();
  const n = DAYS.length + 1;
  const next = step === -99 ? 0 : step === 99 ? n - 1 : Math.min(n - 1, Math.max(0, cur + step));
  show(next);
  $('#tab-' + next).focus();
});

function show(id) {
  cur = id;
  [].forEach.call(tabsBox.children, (b) => {
    const on = +b.dataset.day === id;
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
    if (on) b.scrollIntoView({ inline:'nearest', block:'nearest', behavior: reduced() ? 'auto' : 'smooth' });
  });
  const day = DAYS.find((x) => x.id === id) || null;
  panel.innerHTML = day ? dayHTML(day) : overviewHTML();
  if (firstRender) { const n = panel.firstElementChild; if (n) n.classList.add('first'); firstRender = false; }
  panel.setAttribute('aria-labelledby', 'tab-' + id);
  active = null;
  renderMap(day);
  if (!day) restoreChecks();
  panel.querySelectorAll('[data-detail]').forEach((n) => { n.onclick = () => openDetail(n.dataset.detail, n); });
  panel.querySelectorAll('[data-day]').forEach((n) => { n.onclick = () => { show(+n.dataset.day); scrollTo({ top:0, behavior: reduced() ? 'auto' : 'smooth' }); }; });
  panel.querySelectorAll('.stop').forEach((n) => {
    n.addEventListener('click', (e) => { if (e.target.closest('a,button')) return; focusPlace(n.dataset.place, {}); });
  });
  startSpy();
  if (fabArmed) requestAnimationFrame(updateFab);
  try { localStorage.setItem('sentai.tab', String(id)); } catch (e) {}
}

/* ── 勾選狀態 ── */
function readChecks() { try { return JSON.parse(localStorage.getItem('sentai.checks') || '{}'); } catch (e) { return {}; } }
function restoreChecks() {
  const saved = readChecks();
  const boxes = panel.querySelectorAll('.checks input');
  const sync = () => {
    const n = [].filter.call(boxes, (b) => b.checked).length;
    $('#ptext').textContent = n + ' / ' + boxes.length;
    $('#pfill').style.transform = 'scaleX(' + (boxes.length ? n / boxes.length : 0) + ')';
  };
  boxes.forEach((box, i) => {
    box.checked = !!saved[i];
    box.onchange = () => {
      const cur2 = readChecks();
      cur2[i] = box.checked;
      try { localStorage.setItem('sentai.checks', JSON.stringify(cur2)); } catch (e) {}
      sync();
    };
  });
  sync();
}

/* ── 外觀 ── */
function applyTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  try { t ? localStorage.setItem('sentai.theme', t) : localStorage.removeItem('sentai.theme'); } catch (e) {}
}
$('#theme').onclick = () => {
  const now = document.documentElement.getAttribute('data-theme');
  const dark = now ? now === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  applyTheme(dark ? 'light' : 'dark');
};
try { const t = localStorage.getItem('sentai.theme'); if (t) applyTheme(t); } catch (e) {}

/* ── 啟動 ── */
drawBase();
buildTabs();
let start = 0;
try { const v = localStorage.getItem('sentai.tab'); if (v != null && (+v === 0 || DAYS.some((x) => x.id === +v))) start = +v; } catch (e) {}
show(start);
armFab();
openFromHash();
addEventListener('load', () => fitTo(currentPoints, currentPad));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutLabels);
})();
</script>
